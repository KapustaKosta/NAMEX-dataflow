profile_name: mmpt_tariffs
display_name: Тарифы ММТП
document_match:
  keywords: []
extraction:
  source: ocr
  ocr:
    required: true
    engine: yandex_vision
    lang: rus+eng
    pages: auto
    dpi: 300
blocks:
- selector: &id002
    block_uids:
    - ocr_candidate:2:ocr_p2_fallback
  row_selection: &id003
    use_manual_rows: true
    selected_source_rows: &id001
    - ocr_candidate:2:ocr_p2_fallback:row:30
    - ocr_candidate:2:ocr_p2_fallback:row:32
    - ocr_candidate:2:ocr_p2_fallback:row:35
    - ocr_candidate:2:ocr_p2_fallback:row:37
    - ocr_candidate:2:ocr_p2_fallback:row:40
    keep_after: ''
    keep_until: ''
    keep_numeric_rows_only: false
    skip_empty_values: true
    skip_dash_values: true
    selected_row_uids: *id001
  table_reconstruction: &id004
    method: pair_name_row_with_following_value_row
  column_mapping: &id005
    column_1:
      role: code
      output_field: code
    column_2:
      role: name
      output_field: name
    column_3:
      role: unit
      output_field: unit
    column_4:
      role: value
      output_field: value
      metric: tariff
      scenario: direct
      tariff_type: direct
      value_type: numeric
      year: null
      unit_override: null
      currency_override: null
  source_kind: ocr_candidate
tables:
- section_name: user_profile_section
  table_selector: *id002
  row_filters: *id003
  table_reconstruction: *id004
  column_mapping: *id005
  token_mapping: {}
normalization:
  number_format: ru
  dash_as_null: true
validation:
  required_fields:
  - name
  - value
  value_positive: true
